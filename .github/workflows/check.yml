name: Проверки

# Быстрая проверка на каждый push и pull request: тесты и lint.
# Релизная сборка (build.yml) запускается только вручную.
on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверка версий
        run: |
          set -e
          GRADLE=$(sed -n 's/.*appVersionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          CHANGELOG=$(sed -n 's/.*const val VERSION = "\([^"]*\)".*/\1/p' \
            app/src/main/java/com/mogged/keyboard/Changelog.kt | head -1)
          RELEASE=$(sed -n 's/.*"versionName": *"\([^"]*\)".*/\1/p' release.json | head -1)

          echo "Gradle:    $GRADLE"
          echo "Changelog: $CHANGELOG"
          echo "release:   $RELEASE"

          if [ -z "$GRADLE" ] || [ "$GRADLE" != "$CHANGELOG" ] || [ "$GRADLE" != "$RELEASE" ]; then
            echo "::error::Версии не совпадают: '$GRADLE' / '$CHANGELOG' / '$RELEASE'"
            exit 1
          fi

      - name: Gradle 8.7
        run: |
          set -e
          # Официальный CDN периодически отдаёт 504, поэтому берём тот же
          # дистрибутив с зеркал и сверяем SHA-256 официальной суммы.
          ZIP="$RUNNER_TEMP/gradle.zip"
          OK=0
          for URL in \
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip" \
            "https://repo.huaweicloud.com/gradle/gradle-8.7-bin.zip"
          do
            echo "Скачиваю Gradle: $URL"
            if curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o "$ZIP" "$URL"; then
              OK=1
              break
            fi
          done
          if [ "$OK" -ne 1 ]; then
            echo "::error::Не удалось скачать Gradle 8.7 ни с одного зеркала."
            exit 1
          fi
          echo "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d  $ZIP" | sha256sum -c -
          unzip -q "$ZIP" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.7/bin/gradle" --version
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Юнит-тесты
        run: gradle testReleaseUnitTest --no-daemon --stacktrace

      - name: Lint
        run: |
          set +e
          gradle lintRelease --no-daemon --stacktrace
          code=$?
          if [ "$code" -ne 0 ]; then
            REPORT=app/build/reports/lint-results-release.txt
            if [ -f "$REPORT" ]; then
              echo "----- отчёт lint -----"
              cat "$REPORT"
            fi
          fi
          exit "$code"
