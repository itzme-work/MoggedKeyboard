name: Проверки

# Быстрая проверка на каждый push и pull request: тесты, lint и правила
# проекта. Релизная сборка (build.yml) запускается только вручную.
on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Действия закреплены по SHA коммита: тег может переехать на другой код,
      # SHA — нет. Версия указана в комментарии.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Публичный репозиторий виден всем: служебные следы (токены, прокси,
      # жёсткие IP, пути на телефоне) и служебные слова в README не должны
      # попадать в дерево. Куски строк собраны через кавычки, чтобы сам шаг
      # не ловил собственный текст.
      - name: В репозитории нет служебного
        run: |
          set -e
          TAG="mogged""-token"
          PROXY="gh""fast"
          GH="gh""p_"
          PAT="github""_pat_"
          PHONE="/storage""/"
          IP_RE='([0-9]{1,3}\.){3}[0-9]{1,3}'

          BAD=$(grep -rInE \
            --exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle \
            -e "$TAG" -e "$PROXY" -e "$GH" -e "$PAT" -e "$PHONE" -e "$IP_RE" \
            . || true)
          if [ -n "$BAD" ]; then
            echo "::error::В репозитории остались служебные следы:"
            printf '%s\n' "$BAD"
            exit 1
          fi

          if grep -niE 'секрет|токен' README.md; then
            echo "::error::README не должен упоминать секреты и токены."
            exit 1
          fi
          echo "Служебного в дереве нет."

      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверка версий
        run: |
          set -e
          GRADLE=$(sed -n 's/.*appVersionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          CHANGELOG=$(sed -n 's/.*const val VERSION = "\([^"]*\)".*/\1/p' \
            app/src/main/java/com/mogged/keyboard/Changelog.kt | head -1)
          RELEASE=$(sed -n 's/.*"versionName": *"\([^"]*\)".*/\1/p' release.json | head -1)
          CLAUDE=$(grep -m1 -oE 'Версия: [0-9]+\.[0-9]+\.[0-9]+' CLAUDE.md | sed 's/.*: *//')

          echo "Gradle:    $GRADLE"
          echo "Changelog: $CHANGELOG"
          echo "release:   $RELEASE"
          echo "CLAUDE.md: $CLAUDE"

          if [ -z "$GRADLE" ] || [ "$GRADLE" != "$CHANGELOG" ] || [ "$GRADLE" != "$RELEASE" ]; then
            echo "::error::Версии не совпадают: '$GRADLE' / '$CHANGELOG' / '$RELEASE'"
            exit 1
          fi

          # CLAUDE.md — карта проекта, в нём «Состояние» с версией. Разошлось —
          # значит документацию забыли обновить вместе с релизом.
          if [ -z "$CLAUDE" ] || [ "$GRADLE" != "$CLAUDE" ]; then
            echo "::error::Версия в CLAUDE.md ('$CLAUDE') не совпадает с appVersionName ('$GRADLE')"
            exit 1
          fi

      # Клавиатура ходит в сеть только за обновлениями. Если java.net или
      # UpdateManager появится в другом файле, проверка падает: так сетевой
      # код не расползётся по приложению незаметно.
      - name: Сеть только в обновлениях
        run: |
          set -e
          BAD=$(grep -rlE 'java\.net|UpdateManager' app/src/main/java \
            | grep -v '/UpdateManager.kt$' \
            | grep -v '/MainActivity.kt$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Сеть или UpdateManager упомянуты вне UpdateManager.kt и MainActivity.kt:"
            printf '%s\n' "$BAD"
            exit 1
          fi
          echo "Сетевой код только там, где ему место."

      # Открытый HTTP запрещён и в манифесте, и в конфигурации сети.
      - name: Только HTTPS
        run: |
          set -e
          grep -q 'networkSecurityConfig="@xml/network_security_config"' app/src/main/AndroidManifest.xml \
            || { echo "::error::В манифесте нет networkSecurityConfig"; exit 1; }
          grep -q 'cleartextTrafficPermitted="false"' app/src/main/res/xml/network_security_config.xml \
            || { echo "::error::В network_security_config разрешён открытый HTTP"; exit 1; }

      - name: Gradle 8.7
        run: |
          set -e
          # Официальные адреса Gradle: сторонних зеркал в дереве нет.
          # Запасной вариант — второй официальный хост, сумма SHA-256
          # официальная и проверяется всегда.
          ZIP="$RUNNER_TEMP/gradle.zip"
          OK=0
          for URL in \
            "https://services.gradle.org/distributions/gradle-8.7-bin.zip" \
            "https://downloads.gradle.org/distributions/gradle-8.7-bin.zip"
          do
            echo "Скачиваю Gradle: $URL"
            if curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o "$ZIP" "$URL"; then
              OK=1
              break
            fi
          done
          if [ "$OK" -ne 1 ]; then
            echo "::error::Не удалось скачать Gradle 8.7 ни с одного официального адреса."
            exit 1
          fi
          echo "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d  $ZIP" | sha256sum -c -
          unzip -q "$ZIP" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.7/bin/gradle" --version
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Юнит-тесты
        run: |
          set -o pipefail
          gradle testReleaseUnitTest --no-daemon --stacktrace 2>&1 \
            | tee "$RUNNER_TEMP/unit.log"

      # Журнал Job виден только владельцу репозитория, поэтому причину
      # падения выносим в аннотации: их читает любой, включая агента.
      - name: Причина падения
        if: failure()
        run: |
          set +e
          LOG="$RUNNER_TEMP/unit.log"
          if [ -f "$LOG" ]; then
            grep -aE 'e: file:|AAPT|FAILURE:|Execution failed|FAILED|AssertionError|expected:|but was|Caused by|error: ' "$LOG" \
              | head -40 \
              | while IFS= read -r line; do
                  echo "::error::$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')"
                done
          fi

          R=app/build/reports/lint-results-release.txt
          if [ -f "$R" ]; then
            head -40 "$R" | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')"
            done
          fi

      - name: Lint
        run: |
          set +e
          gradle lintRelease --no-daemon --stacktrace
          code=$?
          if [ "$code" -ne 0 ]; then
            REPORT=app/build/reports/lint-results-release.txt
            if [ -f "$REPORT" ]; then
              echo "----- отчёт lint -----"
              cat "$REPORT"
            fi
          fi
          exit "$code"

      # Повтор после Lint: если упал именно Lint, причина тоже должна
      # попасть в аннотации — журнал Job читает только владелец.
      - name: Причина падения
        if: failure()
        run: |
          set +e
          LOG="$RUNNER_TEMP/unit.log"
          if [ -f "$LOG" ]; then
            grep -aE 'e: file:|AAPT|FAILURE:|Execution failed|FAILED|AssertionError|expected:|but was|Caused by|error: ' "$LOG" \
              | head -40 \
              | while IFS= read -r line; do
                  echo "::error::$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')"
                done
          fi

          R=app/build/reports/lint-results-release.txt
          if [ -f "$R" ]; then
            head -40 "$R" | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')"
            done
          fi
