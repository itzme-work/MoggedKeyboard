name: Build APK

on:
  # Запускается скриптом upload-to-github.sh (или кнопкой Run workflow).
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверка ключа подписи
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ ! -f keystore/mogged.jks ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Нет ключа подписи. Запустите workflow 'Signing setup' и добавьте секрет KEYSTORE_PASSWORD."
            exit 1
          fi

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoggedKeyboard-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Опубликовать в Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          printf '{"versionCode": %s, "versionName": "1.%s"}\n' "$RUN" "$RUN" > version.json

          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Mogged Keyboard" \
            --notes "Автоматическая сборка" \
            --latest

          gh release upload latest "$APK#MoggedKeyboard.apk" version.json --clobber
