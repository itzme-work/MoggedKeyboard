name: Build APK

on:
  # Сборка запускается скриптом upload-to-github.sh (или кнопкой Run workflow).
  # Автозапуск по push отключён: скрипт заливает файлы по одному,
  # иначе получается 20+ лишних сборок.
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoggedKeyboard-apk
          path: app/build/outputs/apk/debug/*.apk
