name: Build APK

on:
  # Запускается скриптом upload-to-github.sh или вручную кнопкой Run workflow.
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

# Права только на чтение: писать в релиз может лишь джоба publish.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Действия закреплены по SHA коммита: тег может переехать на другой код,
      # SHA — нет. Версия указана в комментарии.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверка версий
        run: |
          set -e
          GRADLE=$(sed -n 's/.*appVersionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          CHANGELOG=$(sed -n 's/.*const val VERSION = "\([^"]*\)".*/\1/p' \
            app/src/main/java/com/mogged/keyboard/Changelog.kt | head -1)
          RELEASE=$(sed -n 's/.*"versionName": *"\([^"]*\)".*/\1/p' release.json | head -1)
          CLAUDE=$(grep -m1 -oE 'Версия: [0-9]+\.[0-9]+\.[0-9]+' CLAUDE.md | sed 's/.*: *//')

          echo "Gradle:    $GRADLE"
          echo "Changelog: $CHANGELOG"
          echo "release:   $RELEASE"
          echo "CLAUDE.md: $CLAUDE"

          if [ -z "$GRADLE" ] || [ "$GRADLE" != "$CHANGELOG" ] || [ "$GRADLE" != "$RELEASE" ]; then
            echo "::error::Версии не совпадают: '$GRADLE' / '$CHANGELOG' / '$RELEASE'"
            exit 1
          fi

          # CLAUDE.md — карта проекта, в нём «Состояние» с версией. Разошлось —
          # значит документацию забыли обновить вместе с релизом.
          if [ -z "$CLAUDE" ] || [ "$GRADLE" != "$CLAUDE" ]; then
            echo "::error::Версия в CLAUDE.md ('$CLAUDE') не совпадает с appVersionName ('$GRADLE')"
            exit 1
          fi

      - name: Ключ подписи из секрета
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Нет секретов KEYSTORE_BASE64 и/или KEYSTORE_PASSWORD. См. README → «Ключ подписи»."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/mogged.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::KEYSTORE_BASE64 пустой или повреждён — не удалось декодировать ключ."
            exit 1
          fi

          echo "Ключ подписи готов: $KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Gradle 8.7
        run: |
          set -e
          # Официальный CDN сейчас отдаёт 504 на 8.7, поэтому берём тот же
          # дистрибутив с зеркал и сверяем SHA-256 официальной суммы.
          ZIP="$RUNNER_TEMP/gradle.zip"
          OK=0
          for URL in \
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip" \
            "https://repo.huaweicloud.com/gradle/gradle-8.7-bin.zip"
          do
            echo "Скачиваю Gradle: $URL"
            if curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o "$ZIP" "$URL"; then
              OK=1
              break
            fi
          done
          if [ "$OK" -ne 1 ]; then
            echo "::error::Не удалось скачать Gradle 8.7 ни с одного зеркала."
            exit 1
          fi
          echo "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d  $ZIP" | sha256sum -c -
          unzip -q "$ZIP" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.7/bin/gradle" --version
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Юнит-тесты
        run: |
          set -o pipefail
          gradle testReleaseUnitTest --no-daemon --stacktrace 2>&1 \
            | tee "$RUNNER_TEMP/unit.log"

      # Журнал Job виден только владельцу репозитория, поэтому причину
      # падения выносим в аннотации: их читает любой, включая агента.
      - name: Причина падения
        if: failure()
        run: |
          set +e
          LOG="$RUNNER_TEMP/unit.log"
          if [ -f "$LOG" ]; then
            grep -aE 'e: file:|AAPT|FAILURE:|Execution failed|FAILED|AssertionError|expected:|but was|Caused by|error: ' "$LOG" \
              | head -40 \
              | while IFS= read -r line; do
                  echo "::error::$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')"
                done
          fi

          R=app/build/reports/lint-results-release.txt
          if [ -f "$R" ]; then
            head -40 "$R" | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')"
            done
          fi

      - name: Lint
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set +e
          gradle lintRelease --no-daemon --stacktrace
          code=$?
          if [ "$code" -ne 0 ]; then
            REPORT=app/build/reports/lint-results-release.txt
            if [ -f "$REPORT" ]; then
              echo "----- отчёт lint -----"
              cat "$REPORT"
            fi
          fi
          exit "$code"

      # Повтор после Lint: если упал именно Lint, причина тоже должна
      # попасть в аннотации — журнал Job читает только владелец.
      - name: Причина падения
        if: failure()
        run: |
          set +e
          LOG="$RUNNER_TEMP/unit.log"
          if [ -f "$LOG" ]; then
            grep -aE 'e: file:|AAPT|FAILURE:|Execution failed|FAILED|AssertionError|expected:|but was|Caused by|error: ' "$LOG" \
              | head -40 \
              | while IFS= read -r line; do
                  echo "::error::$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')"
                done
          fi

          R=app/build/reports/lint-results-release.txt
          if [ -f "$R" ]; then
            head -40 "$R" | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')"
            done
          fi

      - name: Сборка release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      # Отпечаток сертификата уходит в релиз (version.json) и в README:
      # по нему можно вручную сверить скачанный APK.
      - name: Проверка подписи
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "::error::APK не собран."; exit 1; }
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/cert.log"
          CERT=$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/cert.log" | head -1)
          if [ -z "$CERT" ]; then
            echo "::error::Не удалось прочитать отпечаток сертификата."
            exit 1
          fi
          echo "Отпечаток сертификата: $CERT"
          printf '%s' "$CERT" > app/build/outputs/apk/release/cert.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MoggedKeyboard-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/cert.txt

  # Релиз — отдельная джоба: только ей нужны права на запись в репозиторий.
  # Окружение release позволяет включить обязательное подтверждение:
  # тогда без нажатия человека релиз не появится.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Скачать сборку
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MoggedKeyboard-apk
          path: apk

      - name: Опубликовать в Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          set -e
          APK=apk/app-release.apk
          [ -f "$APK" ] || { echo "::error::В артефакте нет APK."; exit 1; }
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          CERT=$(cat apk/cert.txt 2>/dev/null || true)
          echo "sha256=$SHA"
          echo "certSha256=$CERT"

          jq --argjson code "$RUN" --arg sha "$SHA" --arg cert "$CERT" \
             '. + {versionCode: $code, sha256: $sha, certSha256: $cert}' \
             release.json > version.json

          cat version.json

          # Явное имя ассета: приложение ищет MoggedKeyboard.apk.
          cp "$APK" MoggedKeyboard.apk

          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Mogged Keyboard" \
            --notes "Автоматическая сборка" \
            --latest

          gh release upload latest MoggedKeyboard.apk version.json docs/icon-512.png --clobber

          # Старое имя ассета из прошлых сборок больше не нужно.
          gh release delete-asset latest app-release.apk --yes 2>/dev/null || true
