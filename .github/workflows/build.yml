name: Build APK

on:
  # Запускается скриптом upload-to-github.sh или вручную кнопкой Run workflow.
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверка версий
        run: |
          set -e
          GRADLE=$(sed -n 's/.*appVersionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          CHANGELOG=$(sed -n 's/.*const val VERSION = "\([^"]*\)".*/\1/p' \
            app/src/main/java/com/mogged/keyboard/Changelog.kt | head -1)
          RELEASE=$(sed -n 's/.*"versionName": *"\([^"]*\)".*/\1/p' release.json | head -1)

          echo "Gradle:    $GRADLE"
          echo "Changelog: $CHANGELOG"
          echo "release:   $RELEASE"

          if [ -z "$GRADLE" ] || [ "$GRADLE" != "$CHANGELOG" ] || [ "$GRADLE" != "$RELEASE" ]; then
            echo "::error::Версии не совпадают: '$GRADLE' / '$CHANGELOG' / '$RELEASE'"
            exit 1
          fi

      - name: Ключ подписи из секрета
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Нет секретов KEYSTORE_BASE64 и/или KEYSTORE_PASSWORD. См. README → «Ключ подписи»."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/mogged.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::KEYSTORE_BASE64 пустой или повреждён — не удалось декодировать ключ."
            exit 1
          fi

          echo "Ключ подписи готов: $KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Gradle 8.7
        run: |
          set -e
          # Официальный CDN сейчас отдаёт 504 на 8.7, поэтому берём тот же
          # дистрибутив с зеркал и сверяем SHA-256 официальной суммы.
          ZIP="$RUNNER_TEMP/gradle.zip"
          OK=0
          for URL in \
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip" \
            "https://repo.huaweicloud.com/gradle/gradle-8.7-bin.zip"
          do
            echo "Скачиваю Gradle: $URL"
            if curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o "$ZIP" "$URL"; then
              OK=1
              break
            fi
          done
          if [ "$OK" -ne 1 ]; then
            echo "::error::Не удалось скачать Gradle 8.7 ни с одного зеркала."
            exit 1
          fi
          echo "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d  $ZIP" | sha256sum -c -
          unzip -q "$ZIP" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.7/bin/gradle" --version
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Юнит-тесты
        run: gradle testReleaseUnitTest --no-daemon --stacktrace

      - name: Lint
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set +e
          gradle lintRelease --no-daemon --stacktrace
          code=$?
          if [ "$code" -ne 0 ]; then
            REPORT=app/build/reports/lint-results-release.txt
            if [ -f "$REPORT" ]; then
              echo "----- отчёт lint -----"
              cat "$REPORT"
            fi
          fi
          exit "$code"

      - name: Сборка release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Проверка подписи
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "::error::APK не собран."; exit 1; }
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoggedKeyboard-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Опубликовать в Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "sha256=$SHA"

          jq --argjson code "$RUN" --arg sha "$SHA" \
             '. + {versionCode: $code, sha256: $sha}' \
             release.json > version.json

          cat version.json

          # Явное имя ассета: приложение ищет MoggedKeyboard.apk.
          cp "$APK" MoggedKeyboard.apk

          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Mogged Keyboard" \
            --notes "Автоматическая сборка" \
            --latest

          gh release upload latest MoggedKeyboard.apk version.json --clobber

          # Старое имя ассета из прошлых сборок больше не нужно.
          gh release delete-asset latest app-release.apk --yes 2>/dev/null || true
