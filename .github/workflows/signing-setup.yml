name: Signing setup

# Одноразовая настройка ключа подписи.
# Запускается вручную, создаёт keystore и коммитит его в репозиторий.
# Перед запуском добавьте секрет KEYSTORE_PASSWORD:
#   Settings → Secrets and variables → Actions → New repository secret

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Создать ключ
        env:
          PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$PASS" ]; then
            echo "::error::Сначала добавьте секрет KEYSTORE_PASSWORD."
            exit 1
          fi

          if [ -f keystore/mogged.jks ]; then
            echo "Ключ уже существует — ничего не делаю."
            exit 0
          fi

          mkdir -p keystore
          keytool -genkeypair \
            -keystore keystore/mogged.jks \
            -alias mogged \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Mogged Keyboard, O=Mogged Keyboard, C=RU"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keystore/mogged.jks
          git commit -m "add signing keystore"
          git push

      - name: Готово
        run: echo "Теперь запускайте Build APK — APK будет подписан постоянно."
