name: Хэши зависимостей

# Ручная сборка: готовит gradle/verification-metadata.xml — контрольные
# суммы всех библиотек, которые тянет Gradle. Файл умеет создавать не только
# локальный Gradle: runner GitHub делает то же самое, поэтому и появилась
# эта сборка. Готовый файл скачивают из артефакта и кладут в дерево; после
# этого «Проверки» и «Build APK» сверяют каждую загрузку с суммой.
#
# Задачи выбраны те же, что в проверках и релизной сборке: тесты, lint и
# release APK проходят по всем конфигурациям зависимостей, поэтому сумм
# хватает и CI, и обычной сборке.
on:
  workflow_dispatch:

concurrency:
  group: verify-deps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Действия закреплены по SHA коммита: тег может переехать на другой код,
      # SHA — нет. Версия указана в комментарии.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      # gradlew сам скачивает Gradle 8.7 с официального адреса и сверяет
      # его SHA-256 — отдельного шага загрузки не нужно. Права на запуск
      # в git могут не сохраниться, поэтому chmod.
      - name: Пишу контрольные суммы
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --write-verification-metadata sha256 \
            testReleaseUnitTest lintRelease assembleRelease \
            --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/hashes.log"

      # Журнал Job виден только владельцу репозитория, поэтому причину
      # падения выносим в аннотации: их читает любой, включая агента.
      - name: Причина падения
        if: failure()
        run: |
          set +e
          LOG="$RUNNER_TEMP/hashes.log"
          if [ -f "$LOG" ]; then
            grep -aE 'e: file:|Could not resolve|Could not download|verification|FAILURE:|Execution failed|FAILED|Caused by|error: ' "$LOG" \
              | head -40 \
              | while IFS= read -r line; do
                  echo "::error::$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')"
                done
          fi

      - name: Файл появился
        run: |
          set -e
          F=gradle/verification-metadata.xml
          if [ ! -s "$F" ]; then
            echo "::error::Gradle не создал $F — смотрите причину падения выше."
            exit 1
          fi
          echo "Библиотек в файле: $(grep -c '<component ' "$F")"
          sha256sum "$F"

      - name: Выкладываю файл
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml

      - name: Что делать дальше
        run: |
          {
            echo "### Хэши готовы"
            echo ""
            echo "1. Скачайте артефакт verification-metadata."
            echo "2. Положите файл в проект: gradle/verification-metadata.xml."
            echo "3. Залейте его в ветку — после этого проверки сверяют суммы."
          } >> "$GITHUB_STEP_SUMMARY"
