version: 2

# Действия закреплены по SHA: тег может переехать на другой код, SHA — нет.
# Dependabot раз в неделю присылает pull request с новой версией и свежим SHA,
# а «Проверки» на нём показывают, что обновление ничего не сломало.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "actions"
